syntax = "proto3";

// Fork-local protobuf for the Valkyrie BLE threat detector. Lives entirely
// inside firmware/src/forks/valkyrie/proto/ and is regenerated by the
// fork-local script (regen-proto.sh). This file MUST NOT be moved into
// the upstream protobufs submodule and MUST NOT be referenced from
// firmware/src/mesh/generated/ — the whole point is to keep upstream
// rebases conflict-free.
//
// Wire format: nanopb-encoded into MeshPacket.decoded.payload.bytes
// with portnum = meshtastic_PortNum_PRIVATE_APP (256). The phone
// (or any PRIVATE_APP consumer) decodes using this same .proto.

package valkyrie;

option java_package = "com.meshtastic.valkyrie";
option java_outer_classname = "ThreatEventProtos";

// Threat classes recognised by Phase 1.
enum ThreatType {
    THREAT_TYPE_NONE = 0;
    THREAT_TYPE_AIRTAG = 1;        // Apple AirTag / Find My
    THREAT_TYPE_FLIPPER = 2;       // Flipper Zero
    THREAT_TYPE_HC_SKIMMER = 3;    // HC-03 / HC-05 / HC-06 module (skimmer)
    THREAT_TYPE_FLOCK = 4;         // Flock automatic licence-plate camera
    THREAT_TYPE_SMART_GLASSES = 5; // Meta Ray-Ban / Quest (manuf 0x01AB, service 0xFD5F)
    THREAT_TYPE_DRONE = 6;         // ASTM F3411 RemoteID broadcast (service 0xFFFA)
}

// One detected BLE threat. The watch emits one of these per
// (mac, type) pair per dedupe_window_secs.
message BleThreatEvent {
    // Seconds since boot (millis()/1000), NOT epoch — the watch may
    // not have a synced RTC. The phone can map to wall clock time on
    // arrival.
    uint32 timestamp = 1;

    ThreatType type = 2;

    // 6-byte BLE MAC address.
    bytes mac = 3;

    // Local name as advertised, NUL-terminated, may be empty.
    string name = 4;

    // RSSI as reported by the controller, dBm.
    sint32 rssi = 5;

    // Free-form short string describing why we matched (e.g. "manuf
    // 0x0FBA", "FF 4C 00 12"). Optional.
    string detail = 6;

    // When true, this emit satisfied GPS-backed multi-sight + multi-place
    // AirTag stalking thresholds (see ValkyriePrefs stalk_* keys).
    bool stalking_gps_triggered = 7;

    // Snapshot counts at emit time (same MAC bucket in AirtagStalkingState).
    uint32 stalking_sightings = 8;
    uint32 stalking_distinct_places = 9;
}
