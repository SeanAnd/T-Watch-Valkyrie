; LilyGo T-Watch S3 — Valkyrie fork overlay
;
; Parallel env to the upstream `t-watch-s3` env. Auto-discovered by the
; `extra_configs = variants/*/*/platformio.ini` glob in the root
; firmware/platformio.ini, so the original env keeps building unchanged.
;
; The only differences vs. the upstream env are:
;   - VALKYRIE_FORK build flag (gates fork code in ValkyrieFork.cpp et al.)
;   - build_src_filter is widened to compile firmware/src/forks/valkyrie/
;
; Everything else (board, partitions, lib_deps) is inherited verbatim.
;
; Upload troubleshooting (Linux + native USB CDC on T-Watch S3): if upload fails at
; "Connecting..." with BrokenPipeError on RTS (ioctl on /dev/ttyACM*) after the
; 1200 baud reset trick, typical causes are (a) ModemManager probing the ACM device,
; (b) stale /dev/ttyACM0 vs a newly enumerated bootloader port — run `pio device list`,
; unplug/replug, try upload without `--upload-port` once, or stop ModemManager briefly.
; If still failing, put the chip in download mode (LilyGO BOOT+RST) and uncomment:
;   upload_flags = --before=no_reset --after=hard_reset
;
[env:t-watch-s3-valkyrie]
extends = env:t-watch-s3

build_flags = ${env:t-watch-s3.build_flags}
  -DVALKYRIE_FORK=1
  -Isrc/forks/valkyrie

; Re-enable the NimBLE observer role for this env only.
;
; Upstream's Arduino-3.x (pioarduino) migration sets
; CONFIG_BT_NIMBLE_ROLE_OBSERVER=n (and ROLE_CENTRAL=n) in esp32-common.ini
; because the stock GATT server only needs the peripheral/broadcaster roles.
; The NimBLE host derives NIMBLE_BLE_SCAN = (BLE_ROLE_CENTRAL ||
; BLE_ROLE_OBSERVER); with both off, ble_gap_disc()/ble_gap_disc_active()
; compile to a stub returning BLE_HS_ENOTSUP, which silently breaks Valkyrie's
; passive BLE threat scanning and BLE heartbeat (both use ble_gap_disc()).
;
; custom_sdkconfig is last-key-wins, so appending OBSERVER=y after the base
; list flips it on for t-watch-s3-valkyrie while stock t-watch-s3 stays lean.
; Only the observer role is needed (passive scan, we never connect as central).
;
; Claw back internal DRAM: the base pins the NimBLE host allocation pool to
; internal RAM (CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL). The observer role we
; just enabled grows that pool, and the T-Watch S3 has 8 MB PSRAM, so move the
; host allocations to SPIRAM. The BT controller (link layer) keeps its own
; internal allocations; only the NimBLE *host* pool moves. WiFi/lwIP already
; spill to PSRAM via the base's CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y.
custom_sdkconfig = ${esp32s3_base.custom_sdkconfig}
  CONFIG_BT_NIMBLE_ROLE_OBSERVER=y
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
;
; More internal-DRAM clawback (all SPIRAM/PSRAM offload, env-scoped):
;
; 1) mbedTLS allocations -> PSRAM. Base uses CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC;
;    TLS in/out buffers are ~16 KB each, so a single HTTPS (esp32_https_server)
;    or MQTT-over-TLS session can transiently eat ~32 KB of internal heap. This
;    has zero idle cost (only changes WHERE TLS allocs land) and removes the
;    internal-heap dip while a secure session is up. Depends on
;    CONFIG_SPIRAM_USE_MALLOC=y (set by base).
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
;
; 2) Lower the "always internal" malloc threshold 4096 -> 2048 so generic heap
;    allocations in the 2-4 KB range (e.g. the BleThreatDetectorModule instance,
;    misc app structs) spill to PSRAM instead of internal DRAM. DMA buffers are
;    unaffected (they request MALLOC_CAP_DMA explicitly). The 1bpp framebuffer is
;    already >4096 so it was already PSRAM-eligible. Trade-off: those mid-size
;    allocations get PSRAM latency; raise back to 4096 if the UI feels sluggish.
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=2048

; Pull forks/valkyrie/ into the source tree. The base env relies on
; arduino_base.build_src_filter (which already includes <src/>), so we
; only need to make sure our subtree is not excluded. We append it
; explicitly so that any future src filter tightening upstream still
; lets our code compile.
build_src_filter = ${env:t-watch-s3.build_src_filter}
  +<forks/valkyrie/>
  -<forks/valkyrie/test/>
  -<forks/valkyrie/proto/threat_event.proto>
  -<forks/valkyrie/regen-proto.sh>
